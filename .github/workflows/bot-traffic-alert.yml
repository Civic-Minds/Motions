name: Bot traffic alert

# Hourly check of Vercel request volume (CIV-1762, CIV-1778) for the
# motions, atlas and atlas-beta projects, each with its own 24h threshold
# (set in scripts/check_bot_traffic.js). For each project over its
# threshold, it opens a `bot-traffic` issue titled with that project, assigned
# to ryanphanna so GitHub emails him (or comments on that project's open
# issue, at most every 6h), naming the top user agents, networks, IP prefixes
# and paths, so the crawler's identity is saved.
#
# Runs here in GitHub Actions using a team-scoped VERCEL_TOKEN secret (a
# project-scoped token gets 403 from the metrics API). The old LaunchAgent
# on Ryan's Mac has been removed.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      thresholds:
        description: 'Per-project overrides of the 24h thresholds, e.g. atlas=10000,motions=20000'
        required: false
        default: ''
      dry_run:
        description: 'Print the report instead of touching issues'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: bot-traffic-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BOT_TRAFFIC_THRESHOLDS: ${{ inputs.thresholds || vars.BOT_TRAFFIC_THRESHOLDS || '' }}
      DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
    steps:
      - name: Check for Vercel token
        id: token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::notice::VERCEL_TOKEN secret is not set; skipping the bot-traffic check."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'
        with:
          sparse-checkout: scripts/check_bot_traffic.js
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 22

      - name: Check request volume
        if: steps.token.outputs.present == 'true'
        run: node scripts/check_bot_traffic.js
