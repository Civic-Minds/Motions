name: Refresh Vancouver Council Data

on:
  schedule:
    - cron: '30 6 * * 2,4,6' # 6:30am UTC Tue/Thu/Sat
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Import Vancouver council data
        run: node scripts/import_vancouver_data.js

      - name: Import upcoming Vancouver meetings
        run: node scripts/import_vancouver_meetings.js

      - name: Geocode Vancouver motion addresses
        run: node scripts/geocode_vancouver_addresses.js

      - name: Audit Vancouver motion data
        continue-on-error: true
        run: npm run validate:vancouver

      - name: Upload Vancouver data to Vercel Blob
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node scripts/upload_to_blob.js --vancouver-only
