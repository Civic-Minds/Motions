name: Refresh Victoria Council Data

on:
  schedule:
    - cron: '30 6 * * 2,4,6'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Install PDF tooling
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils

      - name: Import Victoria council data
        run: node scripts/import_victoria_data.js --from=2022-11-01 --meetings=1000 --rows=50000

      - name: Validate Victoria data
        run: npm run validate:victoria

      - name: Upload Victoria data to Vercel Blob
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node scripts/upload_to_blob.js --city-only=victoria
