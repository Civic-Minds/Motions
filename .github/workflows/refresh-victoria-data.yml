name: Refresh Victoria Council Data

on:
  schedule:
    - cron: '30 6 * * 2,4,6'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install PDF text extractor
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils

      - name: Install dependencies
        run: npm ci

      - name: Download existing Victoria data
        run: |
          mkdir -p public/data/victoria scripts/cache
          curl -sf "https://qcbqayy3ivvb6sia.public.blob.vercel-storage.com/victoria/motions.json" -o public/data/victoria/motions.json || echo "No existing motions, starting fresh"
          curl -sf "https://qcbqayy3ivvb6sia.public.blob.vercel-storage.com/victoria/meetings.json" -o public/data/victoria/meetings.json || echo "No existing meetings, starting fresh"
          curl -sf "https://qcbqayy3ivvb6sia.public.blob.vercel-storage.com/victoria/councillors.json" -o public/data/victoria/councillors.json || echo "No existing councillors, starting fresh"

      - name: Import Victoria council minutes
        run: node scripts/import_victoria_data.js --from=2022-11-01

      - name: Extract structured fields
        run: node scripts/extract_fields.js --city=victoria

      - name: Record Victoria refresh time
        run: node scripts/write_data_metadata.js --city=victoria

      - name: Validate Victoria data
        run: npm run validate:victoria

      - name: Upload Victoria data to Vercel Blob
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node scripts/upload_to_blob.js --city-only=victoria
